apiVersion: apps/v1
kind: Deployment
metadata:
  name: niryo-ned-2
  # namespace: my-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: niryo-ned-2
  template:
    metadata:
      labels:
        env:
          - name: PROMETHEUS_IP
            value: "http://localhost"
          - name: PROMETHEUS_CLIENT_PORT
            value: "8000"
    spec:
      containers:
        - name: niryo-ned-2
          image: gitlab.i2cat.net:5050/areas/software-networks/zero-swarm/remote-control-niryo-ned-2:latest
          ports:
            - containerPort: 8000
          stdin: true
          tty: true
      imagePullSecrets:
      - name: docker-pull-secret   

