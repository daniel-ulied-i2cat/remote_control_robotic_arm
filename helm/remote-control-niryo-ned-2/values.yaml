# Default values for remote-contro-niryo-ned-2.


niryo_ned_2_deployment:
  repository: "gitlab.i2cat.net:5050/areas/software-networks/zero-swarm/remote-control-niryo-ned-2"
  tag: ":latest"
  pullPolicy: Always
  service:
    type: NodePort
    port: 8000
    nodePort: 30000
  prometheus_service:
    type: NodePort
    port: 9090
    nodePort: 30001
    env:
    - name: PROMETHEUS_IP
      value: "http://192.168.40.87"
    - name: PROMETHEUS_CLIENT_PORT
      value: 30735

imagePullSecret: docker-pull-secret


kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      additionalScrapeConfigs:
        - job_name: niryo_ned_2
          static_configs:
            - targets: ["niryo-ned-2:8000"]
          metrics_path: /metrics