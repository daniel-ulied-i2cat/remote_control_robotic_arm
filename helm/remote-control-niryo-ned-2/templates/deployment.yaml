apiVersion: apps/v1
kind: Deployment
metadata:
  name: niryo-ned-2
  # namespace: my-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: niryo-ned-2
  template:
    metadata:
      labels:
        app: niryo-ned-2
    spec:
      containers:
      - name: niryo-ned-2
        image: {{ .Values.niryo_ned_2_deployment.repository }}{{ .Values.niryo_ned_2_deployment.tag }}
        imagePullPolicy: {{.Values.niryo_ned_2_deployment.pullPolicy}}
        env:
          - name: PROMETHEUS_IP
            value: "http://localhost"
          - name: PROMETHEUS_CLIENT_PORT
            value: "8000"
        ports:
        - containerPort: 8000
        stdin: true
        tty: true
      imagePullSecrets:
      - name: {{.Values.imagePullSecret}}